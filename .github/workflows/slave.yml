name: Qwen Autonomous Development Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: qwen-autonomous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autonomous-development:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Initial planning (once only)
        env:
          OPENROUTER_API_KEY: ${{ secrets.LLM_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s PLAN.md ]]; then
            opencode run \
              --model "openrouter/qwen/qwen3.6-plus:free" \
              "Analyze this repository and create PLAN.md.
              Define architecture, priorities, milestones, acceptance criteria,
              test strategy, and a practical long-term roadmap.
              This is planning only. Do not implement project features.
              Create PLAN.md and finish."

            test -s PLAN.md

            git add -- PLAN.md
            git commit -m "docs(ai): create initial roadmap"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "PLAN.md already exists; skipping planning."
          fi

      - name: Autonomous development loop
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        shell: bash
        run: |
          set -uo pipefail

          START=$SECONDS
          LIMIT=19500
          ITERATION=0

          while (( SECONDS - START < LIMIT )); do
            ITERATION=$((ITERATION + 1))

            echo "===== ITERATION ${ITERATION} ====="

            # Sync with the remote branch.
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              echo "Sync failed; retrying in 60 seconds."
              sleep 60
              continue
            fi

            # Develop, test, fix, and record progress.
            if timeout 40m opencode run \
              --model "openrouter/qwen/qwen3.6-plus:free" \
              "You are the autonomous developer of this repository.

              Read PLAN.md and PROGRESS.md if it exists.
              Never recreate the original PLAN.md.

              Select the highest-priority unfinished task.
              Inspect the existing implementation before changing it.
              Implement a useful, bounded improvement.
              Run relevant tests, builds, and lint checks.
              Analyze failures, fix the code, and rerun failed checks.
              Never invent successful test results.

              Update PROGRESS.md with:
              - Changes completed
              - Tests actually executed and their results
              - Known issues and blockers
              - Remaining tasks and the next priority

              Keep the project working.
              Do not expose secrets or make unrelated changes.
              If a task is blocked, document it and try another useful task.

              Complete this development cycle before finishing."; then
              echo "Agent cycle finished."
            else
              echo "Agent failed, timed out, or encountered a provider error."
            fi

            # Stage changes, commit, and push.
            git add -A

            if ! git diff --cached --quiet; then
              if git commit \
                -m "chore(ai): autonomous iteration ${ITERATION}"; then

                if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
                  echo "Push failed; attempting rebase and retry."

                  if git pull --rebase origin "${GITHUB_REF_NAME}"; then
                    git push origin "HEAD:${GITHUB_REF_NAME}" || true
                  fi
                fi
              fi
            else
              echo "No changes to commit."
            fi

            sleep 5
          done

          echo "Time budget reached; next scheduled run will resume."
