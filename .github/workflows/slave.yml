name: 24 Hours Non-Stop Coding Factory
on:
  workflow_dispatch: # 스마트폰으로 '버튼' 누르면 바로 노동 시작하는 스위치

jobs:
  run-slave:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 깃허브 액션 최대 한도인 6시간(360분) 설정!
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: OpenHands 도커 노예 강제 가동
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          docker run --rm \
            -e SANDBOX_USER_ID=0 \
            -e LLM_API_KEY="$LLM_API_KEY" \
            -e LLM_PROVIDER="openrouter" \
            -e LLM_BASE_URL="https://openrouter.ai/api/v1" \
            -e LLM_MODEL="openrouter/free" \
            -e AGENT_PROMPT="지금 당장 HTML과 JS로 끝내주는 모바일 슈팅 게임을 빌드해라. 에러가 나면 지치지 말고 고칠 때까지 반복해라." \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/opt/workspace \
            ghcr.io/all-hands-ai/openhands:latest

      - name: 밤새 노예가 짠 코드 내 저장소에 강제 저장(커밋)
        run: |
          git config --global user.name "Slave-Bot"
          git config --global user.email "slave@bot.com"
          git add . 
          git commit -m "노예가 밤새 채찍질당하며 짠 코드 보고합니다." || exit 0
          git push
